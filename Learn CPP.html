<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ Quest – Full W3Schools</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#58cc02;--green-dk:#46a302;
  --red:#ff4b4b;--red-dk:#c73232;
  --blue:#1cb0f6;--blue-dk:#0a8fc9;
  --yellow:#ffd900;--orange:#ff9600;
  --purple:#a371f7;--purple-dk:#7c50d4;
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;
  --border:#30363d;--text:#e6edf3;--text2:#8b949e;
  --shadow:0 0 0 1px var(--border),0 8px 32px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;background:var(--bg2);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:200;gap:12px;flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;color:var(--green)}
.logo-box{
  width:36px;height:36px;background:var(--green);border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;color:#fff;box-shadow:0 4px 0 var(--green-dk);
  font-family:'JetBrains Mono',monospace;
}
.hstats{display:flex;gap:16px;align-items:center}
.hstat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:14px}
.hstat.xp{color:var(--yellow)}.hstat.streak{color:var(--orange)}.hstat.hearts{color:var(--red)}

/* SCREEN SYSTEM */
#screen-map,#screen-quiz{transition:opacity .25s}
.hidden{display:none!important}

/* ===== MAP SCREEN ===== */
.map-header{
  max-width:800px;margin:0 auto;padding:24px 20px 8px;
  display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;
}
.map-title{font-size:24px;font-weight:900;color:var(--text)}
.map-subtitle{font-size:14px;color:var(--text2);font-weight:600;margin-top:4px}
.map-progress-label{font-size:13px;font-weight:800;color:var(--text2)}

.path-container{max-width:800px;margin:0 auto;padding:16px 20px 60px;position:relative}

.section-label{
  display:flex;align-items:center;gap:10px;
  font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:2px;
  color:var(--text2);margin:28px 0 16px;
}
.section-label::before,.section-label::after{
  content:'';flex:1;height:1px;background:var(--border);
}

/* chapter nodes */
.chapter-row{display:flex;justify-content:center;margin-bottom:12px}
.chapter-node{
  position:relative;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  width:140px;
  transition:transform .15s;
}
.chapter-node:hover .node-btn{transform:translateY(-3px);box-shadow:0 8px 0 var(--node-dk)}
.node-btn{
  width:72px;height:72px;border-radius:50%;
  background:var(--node-color,var(--blue));
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
  box-shadow:0 5px 0 var(--node-dk,var(--blue-dk));
  transition:all .15s;
  position:relative;
}
.node-btn.locked{background:var(--bg3)!important;box-shadow:0 5px 0 #161b22!important;cursor:not-allowed}
.node-btn.locked .node-emoji{filter:grayscale(1);opacity:.4}
.node-btn.done{background:var(--green)!important;box-shadow:0 5px 0 var(--green-dk)!important}
.node-btn.done::after{
  content:'✓';position:absolute;bottom:-4px;right:-4px;
  width:22px;height:22px;border-radius:50%;background:var(--green);
  border:2px solid var(--bg);color:#fff;font-size:11px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
}
.node-label{font-size:12px;font-weight:800;color:var(--text2);text-align:center;line-height:1.3}
.node-xp{font-size:11px;font-weight:700;color:var(--yellow)}
.node-stars{font-size:14px}

/* connector line between nodes */
.connector{width:2px;height:24px;background:var(--border);margin:0 auto -6px;border-radius:2px}
.connector.done-line{background:var(--green)}

/* chapter tooltip */
.chapter-tip{
  position:absolute;top:80px;left:50%;transform:translateX(-50%);
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:12px 16px;width:200px;z-index:10;text-align:center;
  box-shadow:var(--shadow);pointer-events:none;
  opacity:0;transition:opacity .2s;
}
.chapter-node:hover .chapter-tip{opacity:1}
.chapter-tip .tip-title{font-size:13px;font-weight:800;margin-bottom:4px}
.chapter-tip .tip-count{font-size:12px;color:var(--text2);font-weight:600}

/* ===== QUIZ SCREEN ===== */
.quiz-layout{max-width:680px;margin:0 auto;padding:20px}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:8px 14px;font-size:13px;font-weight:700;color:var(--text2);
  cursor:pointer;margin-bottom:16px;transition:all .15s;
}
.back-btn:hover{color:var(--text);border-color:var(--text2)}

.progress-area{margin-bottom:20px}
.prog-meta{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--text2);margin-bottom:6px}
.prog-bar{height:10px;background:var(--bg3);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--green),#7be800);border-radius:99px;transition:width .5s cubic-bezier(.34,1.56,.64,1)}

/* question card */
.q-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:18px;
  padding:24px;margin-bottom:16px;
  animation:qIn .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes qIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}

.q-type-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--bg3);border:1px solid var(--border);border-radius:99px;
  padding:4px 12px;font-size:11px;font-weight:900;letter-spacing:1px;
  text-transform:uppercase;color:var(--purple);margin-bottom:14px;
}
.q-text{font-size:18px;font-weight:800;line-height:1.5;margin-bottom:6px}
.q-sub{font-size:13px;color:var(--text2);font-weight:600;margin-bottom:16px}

/* code snippet in question */
.code-snip{
  background:var(--bg);border:1px solid var(--border);border-radius:10px;
  padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:12.5px;
  line-height:1.75;margin-bottom:16px;overflow-x:auto;
  border-left:3px solid var(--purple);
  white-space:pre;
}
.kw{color:#ff7b72}.fn{color:#d2a8ff}.str{color:#a5d6ff}
.num{color:#f2cc60}.com{color:#6e7681;font-style:italic}.ty{color:#79c0ff}
.op{color:#ff9600}

/* options */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.single{grid-template-columns:1fr}
.opt{
  background:var(--bg3);border:2px solid var(--border);border-radius:12px;
  padding:14px 16px;cursor:pointer;
  font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;color:var(--text);
  text-align:left;display:flex;align-items:center;gap:10px;
  transition:all .15s;position:relative;overflow:hidden;
}
.opt:hover:not(:disabled){border-color:var(--blue);background:rgba(28,176,246,.08);transform:translateY(-1px)}
.opt.sel{border-color:var(--blue);background:rgba(28,176,246,.1)}
.opt.correct{border-color:var(--green);background:rgba(88,204,2,.1);animation:optCorrect .4s cubic-bezier(.34,1.56,.64,1)}
.opt.wrong{border-color:var(--red);background:rgba(255,75,75,.1);animation:optWrong .4s ease}
@keyframes optCorrect{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes optWrong{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.opt-letter{
  width:28px;height:28px;border-radius:7px;background:var(--bg);
  border:2px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;flex-shrink:0;transition:all .15s;
}
.opt.correct .opt-letter{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong .opt-letter{background:var(--red);border-color:var(--red);color:#fff}
.opt-code{font-family:'JetBrains Mono',monospace;font-size:12px}

/* feedback */
.feedback{
  border-radius:14px;padding:18px 20px;margin-bottom:16px;
  animation:fbIn .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes fbIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.feedback.fb-ok{background:rgba(88,204,2,.09);border:2px solid var(--green)}
.feedback.fb-no{background:rgba(255,75,75,.09);border:2px solid var(--red)}
.fb-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.fb-icon{font-size:22px;animation:fbIcon .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes fbIcon{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1)}}
.fb-title{font-size:17px;font-weight:900}
.fb-ok .fb-title{color:var(--green)}.fb-no .fb-title{color:var(--red)}
.fb-exp{font-size:13px;font-weight:600;color:var(--text2);line-height:1.6;margin-bottom:12px}
.fb-note{font-size:12px;font-weight:800;color:var(--yellow);margin-bottom:10px}

/* demo runner */
.demo-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.demo-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:var(--bg3);border-bottom:1px solid var(--border);
}
.demo-dots{display:flex;gap:5px}
.demo-dots span{width:9px;height:9px;border-radius:50%}
.demo-dots span:nth-child(1){background:#ff5f57}
.demo-dots span:nth-child(2){background:#febc2e}
.demo-dots span:nth-child(3){background:#28c840}
.demo-fn{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text2)}
.run-btn{
  display:flex;align-items:center;gap:4px;
  background:var(--green);color:#fff;border:none;border-radius:5px;
  padding:4px 10px;font-size:11px;font-weight:800;cursor:pointer;
  font-family:'Nunito',sans-serif;box-shadow:0 2px 0 var(--green-dk);
  transition:all .12s;
}
.run-btn:hover{transform:translateY(-1px);box-shadow:0 3px 0 var(--green-dk)}
.run-btn:active{transform:translateY(1px);box-shadow:none}
.run-btn:disabled{background:var(--bg3);box-shadow:none;cursor:default;transform:none}
.demo-code{
  padding:12px 14px;font-family:'JetBrains Mono',monospace;
  font-size:11.5px;line-height:1.7;white-space:pre;overflow-x:auto;
}
.demo-div{border-top:1px solid var(--border)}
.demo-out{
  padding:10px 14px;font-family:'JetBrains Mono',monospace;
  font-size:12px;color:var(--green);min-height:32px;white-space:pre-wrap;
}
.demo-out.err{color:var(--red)}
.out-label{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--text2);display:block;margin-bottom:4px}
.hl{background:rgba(255,255,0,.1);display:block;margin:0 -14px;padding:0 14px;border-left:3px solid var(--yellow)}
.el{background:rgba(255,75,75,.1);display:block;margin:0 -14px;padding:0 14px;border-left:3px solid var(--red)}
.cursor{display:inline-block;width:6px;height:13px;background:var(--green);animation:blink 1s infinite;vertical-align:text-bottom;margin-left:1px}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* CTA buttons */
.cta{
  width:100%;padding:16px;border-radius:12px;
  font-family:'Nunito',sans-serif;font-size:16px;font-weight:900;
  border:none;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;
  transition:all .15s;
}
.cta.check{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dk)}
.cta.check:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--green-dk)}
.cta.check:active{transform:translateY(1px);box-shadow:0 1px 0 var(--green-dk)}
.cta.check:disabled{background:var(--bg3);color:var(--text2);box-shadow:none;transform:none;cursor:default}
.cta.next{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-dk)}
.cta.next:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--blue-dk)}
.cta.next:active{transform:translateY(1px);box-shadow:0 1px 0 var(--blue-dk)}

/* COMPLETE screen */
.complete{text-align:center;padding:40px 20px;animation:qIn .5s cubic-bezier(.34,1.56,.64,1)}
.trophy{font-size:72px;display:block;animation:trophyIn .6s cubic-bezier(.34,1.56,.64,1);margin-bottom:12px}
@keyframes trophyIn{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1)}}
.comp-title{font-size:32px;font-weight:900;color:var(--yellow);margin-bottom:6px}
.comp-sub{font-size:14px;color:var(--text2);font-weight:700;margin-bottom:28px}
.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.sc{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px 10px}
.sv{font-size:28px;font-weight:900;margin-bottom:4px}
.sl{font-size:11px;font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:1px}
.comp-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.comp-btn{
  padding:14px 28px;border-radius:12px;font-family:'Nunito',sans-serif;
  font-size:14px;font-weight:900;border:none;cursor:pointer;transition:all .15s;
  text-transform:uppercase;letter-spacing:.5px;
}
.comp-btn.retry{background:var(--yellow);color:#000;box-shadow:0 4px 0 #c9a900}
.comp-btn.retry:hover{transform:translateY(-2px);box-shadow:0 6px 0 #c9a900}
.comp-btn.map{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.comp-btn.map:hover{border-color:var(--text2)}

/* XP toast */
.xp-toast{
  position:fixed;top:65px;left:50%;transform:translateX(-50%);
  background:var(--yellow);color:#000;font-weight:900;font-size:16px;
  padding:8px 22px;border-radius:99px;pointer-events:none;z-index:999;
  display:none;animation:xpAnim 1.4s forwards;
}
@keyframes xpAnim{
  0%{opacity:0;transform:translateX(-50%) scale(.8)}
  15%{opacity:1;transform:translateX(-50%) scale(1.1)}
  70%{opacity:1;transform:translateX(-50%) translateY(-8px) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-24px) scale(.9)}
}

/* confetti */
.conf-wrap{position:fixed;inset:0;pointer-events:none;z-index:998}
.conf-p{position:absolute;top:-20px;border-radius:2px;animation:confFall linear forwards}
@keyframes confFall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* responsive */
@media(max-width:540px){
  .opts{grid-template-columns:1fr}
  .score-grid{grid-template-columns:1fr}
  .q-text{font-size:16px}
  .path-container{padding:12px 12px 60px}
}

/* scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-box">C++</div>
    C++ Quest
  </div>
  <div class="hstats">
    <div class="hstat xp">⚡ <span id="h-xp">0</span> XP</div>
    <div class="hstat streak">🔥 <span id="h-streak">0</span></div>
    <div class="hstat hearts">❤️ <span id="h-hearts">5</span></div>
  </div>
</header>

<!-- MAP -->
<div id="screen-map">
  <div class="map-header">
    <div>
      <div class="map-title">🗺️ Peta Belajar C++</div>
      <div class="map-subtitle">Semua materi W3Schools C++ — dari dasar sampai OOP & STL</div>
    </div>
    <div class="map-progress-label" id="map-prog-label">0 / 0 chapter selesai</div>
  </div>
  <div class="path-container" id="path-container"></div>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="hidden">
  <div class="quiz-layout">
    <button class="back-btn" onclick="goMap()">← Kembali ke Peta</button>
    <div class="progress-area">
      <div class="prog-meta">
        <span id="q-counter">Soal 1 / 1</span>
        <span id="q-chapter-name">-</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <div id="q-area"></div>
  </div>
</div>

<!-- COMPLETE -->
<div id="screen-complete" class="hidden">
  <div class="quiz-layout">
    <div class="complete" id="complete-inner"></div>
  </div>
</div>

<div class="xp-toast" id="xp-toast">+10 XP ⚡</div>
<div class="conf-wrap" id="conf-wrap"></div>

<script>
// ================================================
// DATA: semua chapter sesuai urutan W3Schools C++
// ================================================
const CHAPTERS = [
  // ---- DASAR ----
  {
    id:'intro', emoji:'👋', label:'Intro & Setup', color:'#1cb0f6', colorDk:'#0a8fc9',
    section:'Dasar',
    questions:[
      {
        type:'Pilihan Ganda', q:'C++ dikembangkan oleh siapa?',
        code:null,
        opts:['Dennis Ritchie','Bjarne Stroustrup','James Gosling','Guido van Rossum'],
        ans:1,
        exp:'C++ dibuat oleh Bjarne Stroustrup pada awal 1980-an sebagai ekstensi dari bahasa C.',
        demo:{c:`// C++ dibuat oleh Bjarne Stroustrup\n#include <iostream>\nusing namespace std;\nint main() {\n    cout << "Hello, C++!" << endl;\n    return 0;\n}`,out:'Hello, C++!',hl:4,err:false},
        wdemo:{c:`// Dennis Ritchie buat C (bukan C++)\n// James Gosling buat Java\n// Guido van Rossum buat Python`,out:'Jawaban salah!',hl:0,err:true,note:'Bjarne Stroustrup = C++, bukan yang lain!'}
      },
      {
        type:'Pilihan Ganda', q:'Ekstensi file C++ yang benar adalah?',
        code:null,
        opts:['.c','.cpp','.cs','.cx'],
        ans:1,
        exp:'.cpp adalah ekstensi standar file C++. .c untuk C, .cs untuk C#.',
        demo:{c:`// File: main.cpp\n#include <iostream>\nusing namespace std;\nint main() {\n    cout << "File .cpp benar!";\n    return 0;\n}`,out:'File .cpp benar!',hl:0,err:false},
        wdemo:{c:`// .c adalah ekstensi C (bukan C++)\n// .cs adalah C# (bukan C++)\n// Gunakan .cpp untuk C++`,out:'Ekstensi salah!',hl:0,err:true,note:'Selalu pakai .cpp untuk file C++!'}
      },
      {
        type:'Pilihan Ganda', q:'Apa fungsi dari `#include <iostream>`?',
        code:`<span class="kw">#include</span> <span class="str">&lt;iostream&gt;</span>\n<span class="kw">using namespace</span> <span class="ty">std</span>;`,
        opts:['Mendefinisikan fungsi main','Mengimpor library input/output','Membuat class baru','Deklarasi variabel global'],
        ans:1,
        exp:'#include <iostream> mengimpor library I/O standar yang berisi cout, cin, cerr, dll.',
        demo:{c:`#include <iostream>  // import library I/O\nusing namespace std;\nint main() {\n    cout << "iostream dipakai!";\n    return 0;\n}`,out:'iostream dipakai!',hl:0,err:false},
        wdemo:{c:`// Tanpa #include <iostream>:\n// cout << "Hello"; // ERROR!\n// error: 'cout' was not declared`,out:'error: cout was not declared',hl:1,err:true,note:'Tanpa iostream, cout tidak dikenali compiler!'}
      },
      {
        type:'Pilihan Ganda', q:'Setiap program C++ WAJIB memiliki fungsi apa?',
        code:null,
        opts:['start()','begin()','main()','run()'],
        ans:2,
        exp:'Fungsi main() adalah titik masuk (entry point) wajib setiap program C++. Eksekusi selalu dimulai dari sini.',
        demo:{c:`#include <iostream>\nusing namespace std;\n\nint main() {  // WAJIB ada!\n    cout << "Program dimulai dari main()";\n    return 0;\n}`,out:'Program dimulai dari main()',hl:3,err:false},
        wdemo:{c:`// Tanpa main():\n// error: undefined reference to 'main'\n// Linker tidak tahu dari mana mulai!`,out:'undefined reference to main',hl:1,err:true,note:'Setiap program C++ HARUS punya main()!'}
      }
    ]
  },

  {
    id:'syntax', emoji:'📝', label:'Syntax & Output', color:'#a371f7', colorDk:'#7c50d4',
    section:'Dasar',
    questions:[
      {
        type:'Pilihan Ganda', q:'Apa output dari kode berikut?',
        code:`<span class="kw">#include</span> <span class="str">&lt;iostream&gt;</span>\n<span class="kw">using namespace</span> <span class="ty">std</span>;\n<span class="ty">int</span> <span class="fn">main</span>() {\n    <span class="ty">cout</span> <span class="op">&lt;&lt;</span> <span class="str">"Hello World!"</span>;\n    <span class="kw">return</span> <span class="num">0</span>;\n}`,
        opts:['hello world!','Hello World!','Hello World','Error'],
        ans:1,

// ================================================
// STATE
// ================================================
let xp = 0, hearts = 5, streak = 0;
let chaptersCompleted = {};
let curChapter = null, curQ = 0, curSel = null, curChecked = false;
let correctCount = 0;

// ================================================
// RENDER MAP
// ================================================
function renderMap() {
  const container = document.getElementById('path-container');
  let html = '';
  let prevSection = '';

  CHAPTERS.forEach((ch, idx) => {
    if (ch.section !== prevSection) {
      html += `<div class="section-label">${ch.section}</div>`;
      prevSection = ch.section;
    }

    const done = !!chaptersCompleted[ch.id];
    const locked = idx > 0 && !chaptersCompleted[CHAPTERS[idx-1].id];
    const stars = done ? '⭐⭐⭐' : (locked ? '🔒' : '○○○');

    // connector line
    if (idx > 0) {
      html += `<div class="connector ${chaptersCompleted[CHAPTERS[idx-1].id] ? 'done-line' : ''}"></div>`;
    }

    // offset alternately
    const offset = idx % 3 === 0 ? '0' : idx % 3 === 1 ? '60px' : '-60px';

    html += `
    <div class="chapter-row">
      <div class="chapter-node" style="margin-left:${offset}" onclick="${locked ? '' : `startChapter('${ch.id}')`}">
        <button class="node-btn ${done ? 'done' : locked ? 'locked' : ''}"
          style="--node-color:${ch.color};--node-dk:${ch.colorDk}">
          <span class="node-emoji">${ch.emoji}</span>
        </button>
        <div class="node-label">${ch.label}</div>
        <div class="node-stars">${stars}</div>
        <div class="chapter-tip">
          <div class="tip-title">${ch.label}</div>
          <div class="tip-count">${ch.questions.length} soal • ${ch.questions.length * 10} XP</div>
        </div>
      </div>
    </div>`;
  });

  container.innerHTML = html;

  // update counter
  const done = Object.keys(chaptersCompleted).length;
  document.getElementById('map-prog-label').textContent = `${done} / ${CHAPTERS.length} chapter selesai`;
}

// ================================================
// START CHAPTER
// ================================================
function startChapter(id) {
  curChapter = CHAPTERS.find(c => c.id === id);
  curQ = 0; curSel = null; curChecked = false; correctCount = 0;
  document.getElementById('q-chapter-name').textContent = curChapter.emoji + ' ' + curChapter.label;
  show('quiz');
  renderQ();
}

// ================================================
// RENDER QUESTION
// ================================================
function renderQ() {
  const q = curChapter.questions[curQ];
  const total = curChapter.questions.length;
  const pct = (curQ / total) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('q-counter').textContent = `Soal ${curQ+1} / ${total}`;

  const letters = ['A','B','C','D'];
  const isSingle = q.opts.some(o => o.length > 30);
  const optsHtml = q.opts.map((opt, i) => `
    <button class="opt" id="opt-${i}" onclick="selOpt(${i})">
      <span class="opt-letter">${letters[i]}</span>
      <span class="${isCodeText(opt) ? 'opt-code' : ''}">${esc(opt)}</span>
    </button>`).join('');

  document.getElementById('q-area').innerHTML = `
    <div class="q-card">
      <div class="q-type-badge">📌 ${q.type}</div>
      <div class="q-text">${q.q}</div>
      ${q.code ? `<div class="code-snip">${q.code}</div>` : ''}
      <div class="opts ${isSingle ? 'single' : ''}" id="opts-wrap">${optsHtml}</div>
    </div>
    <div id="fb-area"></div>
    <button class="cta check" id="cta" disabled onclick="checkAns()">CEK JAWABAN ✓</button>
  `;
}

function isCodeText(s) { return /[{}<>()=;*&]/.test(s); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ================================================
// SELECT OPTION
// ================================================
function selOpt(i) {
  if (curChecked) return;
  curSel = i;
  document.querySelectorAll('.opt').forEach((b,idx) => b.classList.toggle('sel', idx===i));
  document.getElementById('cta').disabled = false;
}

// ================================================
// CHECK ANSWER
// ================================================
function checkAns() {
  if (curSel === null || curChecked) return;
  curChecked = true;
  const q = curChapter.questions[curQ];
  const right = curSel === q.ans;

  document.getElementById(`opt-${q.ans}`).classList.add('correct');
  if (!right) document.getElementById(`opt-${curSel}`).classList.add('wrong');
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);

  if (right) {
    xp += 10; streak++; correctCount++;
    document.getElementById('h-xp').textContent = xp;
    document.getElementById('h-streak').textContent = streak;
    showXpToast();
  } else {
    hearts = Math.max(0, hearts - 1);
    streak = 0;
    document.getElementById('h-hearts').textContent = hearts;
    document.getElementById('h-streak').textContent = 0;
  }

  showFeedback(right, q);
  const cta = document.getElementById('cta');
  const isLast = curQ >= curChapter.questions.length - 1;
  cta.className = 'cta next';
  cta.textContent = isLast ? 'SELESAI 🏆' : 'LANJUT →';
  cta.onclick = nextQ;
}

// ================================================
// FEEDBACK + DEMO
// ================================================
function showFeedback(right, q) {
  const fb = document.getElementById('fb-area');
  const demo = right ? q.demo : q.wdemo;
  const lines = demo.c.split('\n');
  const codeHtml = lines.map((line, i) => {
    const e = esc(line);
    if (i === demo.hl) return `<span class="${right ? 'hl' : 'el'}">${e}</span>`;
    return e;
  }).join('\n');

  const noteHtml = (!right && demo.note) ? `<div class="fb-note">⚠️ ${demo.note}</div>` : '';
  const outId = `demo-out-${Date.now()}`;

  // encode output untuk button
  const b64 = btoa(unescape(encodeURIComponent(demo.out)));

  fb.innerHTML = `
    <div class="feedback ${right ? 'fb-ok' : 'fb-no'}">
      <div class="fb-head">
        <span class="fb-icon">${right ? '🎉' : '💡'}</span>
        <span class="fb-title">${right ? 'Benar! Mantap!' : 'Belum Tepat!'}</span>
      </div>
      <div class="fb-exp">${q.exp}</div>
      ${noteHtml}
      <div class="demo-box">
        <div class="demo-top">
          <div class="demo-dots"><span></span><span></span><span></span></div>
          <span class="demo-fn">main.cpp</span>
          <button class="run-btn" id="run-${outId}" onclick="runDemo('${outId}','${b64}',${demo.err})">▶ Run</button>
        </div>
        <div class="demo-code">${codeHtml}</div>
        <div class="demo-div"></div>
        <div class="demo-out" id="${outId}">
          <span class="out-label">Output</span>
          <span style="color:var(--text2)">Klik ▶ Run...</span>
        </div>
      </div>
    </div>`;
}

// ================================================
// ANIMASI RUN
// ================================================
function runDemo(outId, b64, isErr) {
  const outEl = document.getElementById(outId);
  const runBtn = document.getElementById('run-'+outId);
  let output;
  try { output = decodeURIComponent(escape(atob(b64))); } catch(e) { output = atob(b64); }

  runBtn.disabled = true;
  runBtn.textContent = '⏳';
  outEl.innerHTML = `<span class="out-label">Output</span><span class="cursor"></span>`;

  let i = 0;
  const label = `<span class="out-label">Output</span>`;
  const cls = isErr ? 'err' : '';
  setTimeout(() => {
    const iv = setInterval(() => {
      if (i <= output.length) {
        outEl.className = `demo-out ${cls}`;
        outEl.innerHTML = `${label}<span>${esc(output.slice(0,i))}</span><span class="cursor"></span>`;
        i++;
      } else {
        outEl.innerHTML = `${label}<span>${esc(output)}</span>`;
        runBtn.textContent = '▶ Run';
        runBtn.disabled = false;
        clearInterval(iv);
      }
    }, 30);
  }, 500);
}

// ================================================
// NEXT QUESTION
// ================================================
function nextQ() {
  curQ++;
  curSel = null;
  curChecked = false;
  if (curQ >= curChapter.questions.length) {
    showComplete();
  } else {
    renderQ();
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

// ================================================
// COMPLETE CHAPTER
// ================================================
function showComplete() {
  chaptersCompleted[curChapter.id] = true;
  const total = curChapter.questions.length;
  const acc = Math.round((correctCount / total) * 100);

  show('complete');
  document.getElementById('complete-inner').innerHTML = `
    <span class="trophy">🏆</span>
    <div class="comp-title">Chapter Selesai!</div>
    <div class="comp-sub">${curChapter.emoji} ${curChapter.label} — Berhasil kamu kuasai!</div>
    <div class="score-grid">
      <div class="sc"><div class="sv" style="color:var(--yellow)">${correctCount * 10}</div><div class="sl">XP Didapat</div></div>
      <div class="sc"><div class="sv" style="color:var(--green)">${correctCount}/${total}</div><div class="sl">Benar</div></div>
      <div class="sc"><div class="sv" style="color:var(--blue)">${acc}%</div><div class="sl">Akurasi</div></div>
    </div>
    <div class="comp-btns">
      <button class="comp-btn retry" onclick="startChapter('${curChapter.id}')">🔄 Ulang</button>
      <button class="comp-btn map" onclick="goMap()">🗺️ Ke Peta</button>
    </div>`;

  if (acc >= 70) spawnConfetti();
}

// ================================================
// NAVIGATION
// ================================================
function show(screen) {
  document.getElementById('screen-map').classList.toggle('hidden', screen !== 'map');
  document.getElementById('screen-quiz').classList.toggle('hidden', screen !== 'quiz');
  document.getElementById('screen-complete').classList.toggle('hidden', screen !== 'complete');
}

function goMap() {
  show('map');
  renderMap();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ================================================
// XP TOAST
// ================================================
function showXpToast() {
  const t = document.getElementById('xp-toast');
  t.style.display = 'block';
  t.style.animation = 'none';
  void t.offsetWidth;
  t.style.animation = 'xpAnim 1.4s forwards';
  setTimeout(() => t.style.display = 'none', 1400);
}

// ================================================
// CONFETTI
// ================================================
function spawnConfetti() {
  const wrap = document.getElementById('conf-wrap');
  wrap.innerHTML = '';
  const colors = ['#58cc02','#ffd900','#1cb0f6','#ff4b4b','#a371f7','#ff9600','#fff'];
  for (let i = 0; i < 70; i++) {
    const el = document.createElement('div');
    el.className = 'conf-p';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (1.2 + Math.random() * 2) + 's';
    el.style.animationDelay = (Math.random() * 0.8) + 's';
    const sz = 6 + Math.random() * 10;
    el.style.width = sz + 'px';
    el.style.height = sz + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }
}
